<!DOCTYPE html><html><head>
  <script>
    // Canonical host: the default Firebase domains redirect to blablacamp.com,
    // so only the custom domain serves the product.
    (function () {
      var h = location.hostname;
      if (h === 'blablacamp.web.app' || h === 'blablacamp.firebaseapp.com') {
        location.replace(
          'https://blablacamp.com' +
            location.pathname + location.search + location.hash);
      }
    })();
  </script>

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "e8629160-6025-4820-8bd6-4cf28cac5a23",
        allowLocalhostAsSecureOrigin: true,
      });
    });
  </script>

    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #121719;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
