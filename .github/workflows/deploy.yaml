name: Deploy

# Deploys on every push to main: web → Firebase Hosting, Android APK as artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: Web → Firebase Hosting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --dart-define-from-file=dart_defines.json
      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: blablacamp
          entryPoint: .

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - name: Restore google-services.json
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - run: flutter pub get
      - run: flutter build apk --release --dart-define-from-file=dart_defines.json
      - uses: actions/upload-artifact@v4
        with:
          name: blablacamp-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
