name: Firebase Deploy Web
run-name: Deploy web · ${{ github.ref_name }}

# Builds the Flutter web app and publishes it to Firebase Hosting (blablacamp.com)
# on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-web:
    name: Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build web (release)
        run: flutter build web --release --dart-define-from-file=dart_defines.json
      - name: Publish to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: blablacamp
          entryPoint: .
